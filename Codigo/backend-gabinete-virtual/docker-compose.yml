services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: gabinete_virtual_backend_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: gabinete_virtual
      DB_USERNAME: gabinete
      DB_PASSWORD: secret
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16-alpine
    container_name: gabinete_virtual_backend_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: gabinete_virtual
      POSTGRES_USER: gabinete
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabinete -d gabinete_virtual"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
